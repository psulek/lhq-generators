name: Publish Package

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  NODE_VERSION: '22.x'
  MOCHA_COLORS: '0'
  REGISTRY_URL: 'https://npm.pkg.github.com'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      # Set up PNPM_HOME directory to avoid errors such
      # as `ERR_PNPM_NO_GLOBAL_BIN_DIR`:
      #
      # ```
      # `ERR_PNPM_NO_GLOBAL_BIN_DIR` Unable to find the global bin directory
      # Run "pnpm setup" to create it automatically, or set the global-bin-dir setting, or the PNPM_HOME env variable. The global bin directory should be in the PATH.
      # ```
      #
      # - https://github.com/pnpm/pnpm/issues/9191#issuecomment-2687756396
      - name: Set up pnpm global bin directory for `pnpm add --global`
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            PNPM_HOME=/c/Program\ Files/Git/home/runner/.local/share/pnpm
          elif [ "$RUNNER_OS" == "Linux" ]; then
            PNPM_HOME=/home/runner/.local/share/pnpm
          fi
          echo "PNPM_HOME=$PNPM_HOME" >> "$GITHUB_ENV"
          echo "$PNPM_HOME/bin" >> "$GITHUB_PATH"

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.REGISTRY_URL }}
          scope: '@psulek'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm add -g vsce semver

      - name: Validate release tag value
        if: github.event_name == 'release'
        id: validate_tag
        uses: ./.github/actions/validate-tag
        with:
          tag: ${{ github.event.release.tag_name }}
          allow_prerelease: 'true'
          compare_package_version: 'false'

      - name: Set version from release tag
        if: github.event_name == 'release'
        run: |
          echo "PACKAGE_NAME=${{ steps.validate_tag.outputs.package_name }}" >> $GITHUB_ENV
          echo "PACKAGE_VERSION=${{ steps.validate_tag.outputs.tag_version }}" >> $GITHUB_ENV
          echo "TAG_VALID=${{ steps.validate_tag.outputs.tag_valid }}" >> $GITHUB_ENV

      - name: Set version for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
          echo "TAG_VALID=1" >> $GITHUB_ENV

      - name: Check for existing published version on registry
        if: env.TAG_VALID == '1'
        id: check_published
        run: |
          echo "::notice::Checking if version $PACKAGE_VERSION of package $PACKAGE_NAME is already published."

          if pnpm view "$PACKAGE_NAME@$PACKAGE_VERSION" --registry ${{ env.REGISTRY_URL }} version > /dev/null 2>&1; then
            echo "::error::Version $PACKAGE_VERSION of package $PACKAGE_NAME is already published."
            echo "TAG_VALID=0" >> $GITHUB_ENV
          else
            echo "::notice::Version $PACKAGE_VERSION of package $PACKAGE_NAME is not published yet. Proceeding..."
          fi

      - name: Mark release as draft on invalid release tag
        if: env.TAG_VALID == '0' && github.event_name == 'release'
        uses: ./.github/actions/mark-draft
        with:
          reason: "Invalid tag format"

      - name: Stop workflow on invalid version
        if: env.TAG_VALID == '0'
        run: exit 1

      - name: Run tests
        run: pnpm test

      - name: Build package
        run: pnpm run build-all --notests --version=$PACKAGE_VERSION

      - name: Publish to GitHub Packages
        uses: actions/github-script@v8
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            try {
              const fs = require('fs');
              const path = require('path');

              const version = process.env.PACKAGE_VERSION;
              const packageName = process.env.PACKAGE_NAME;

              process.chdir('dist');

              core.info(`Creating package for '${packageName}' version '${version}' ...`);
              let exitCode = await exec.exec('pnpm', ['pack']);

              if (exitCode !== 0) {
                throw new Error(`Creating package failed with exit code ${exitCode}`);
              }

              const packageTar = `psulek-lhq-generators-${version}.tgz`;

              if (!fs.existsSync(packageTar)) {
                throw new Error(`Package file '${packageTar}' not found after pack.`);
              }

              exitCode = await exec.exec('pnpm', ['publish', '--access', 'public', '--provenance', '--no-git-checks']);
              if (exitCode !== 0) {
                throw new Error(`Package publishing failed with exit code ${exitCode}`);
              }

              core.exportVariable('PACKAGE_PATH', path.resolve(packageTar));
              core.exportVariable('PACKAGE_URL', `https://github.com/${context.repo.owner}/${context.repo.repo}/pkgs/npm/lhq-generators`);
              core.exportVariable('PUBLISH_SUCCESS', '1');
            } catch (err) {
              core.error(`Error during package publishing: ${err}`);
              core.exportVariable('PUBLISH_SUCCESS', '0');
            }

      - name: Upload tarball to release
        if: env.PUBLISH_SUCCESS == '1' && github.event_name == 'release'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
              name: path.basename(process.env.PACKAGE_PATH),
              data: await fs.promises.readFile(process.env.PACKAGE_PATH)
            });

      - name: Mark release as draft on package publish failure
        if: env.PUBLISH_SUCCESS == '0' && github.event_name == 'release'
        uses: ./.github/actions/mark-draft
        with:
          reason: "Package publish failed"

      - name: Stop workflow on package publish failure
        if: env.PUBLISH_SUCCESS == '0'
        run: exit 1

      - name: Add published package to the release
        if: env.PUBLISH_SUCCESS == '1' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          body: '📦 **Package:** [View on GitHub Packages](${{ env.PACKAGE_URL }})'
          append_body: true
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ env.PACKAGE_PATH }}
